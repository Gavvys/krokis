<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krokis Dashboard</title>
    <!-- Theme: set data-theme on <html> before any stylesheet loads to prevent flash -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('krokis.theme');
                var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            try {
                var width = parseInt(localStorage.getItem('krokis.sidebarWidth'), 10);
                if (width >= 200 && width <= 560) {
                    document.documentElement.style.setProperty('--krokis-sidebar-width', width + 'px');
                }
            } catch (e) {
                // localStorage unavailable; keep the CSS default.
            }
        })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Marked.js (Markdown parsing) -->
    <script src="/vendor/marked.min.js"></script>
    <!-- Prism.js (Syntax highlighting) -->
    <link href="/vendor/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="/vendor/prism.min.js"></script>
    <script src="/mdx/registry.js"></script>
    <!-- Custom styling -->
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/styles.css">
    <!-- RapiDoc (OpenAPI UI Web Component) -->
    <script type="module" src="/vendor/rapidoc-min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">▲</span>
                    <span class="logo-text">Krokis</span>
                </div>
                <button id="refresh-btn" class="icon-btn" type="button" title="Refresh telemetry" aria-label="Refresh telemetry">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/>
                    </svg>
                </button>
                <button id="theme-toggle" class="icon-btn" type="button" title="Dark theme" aria-label="Switch to light theme">
                    <svg class="theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1Zm0 17a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1ZM4.22 4.22a1 1 0 0 1 1.41 0l1.42 1.42a1 1 0 1 1-1.41 1.41L4.22 5.64a1 1 0 0 1 0-1.42Zm12.73 12.73a1 1 0 0 1 1.41 0l1.42 1.42a1 1 0 1 1-1.41 1.41l-1.42-1.42a1 1 0 0 1 0-1.41ZM2 12a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2H3a1 1 0 0 1-1-1Zm17 0a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2h-2a1 1 0 0 1-1-1ZM4.22 19.78a1 1 0 0 1 0-1.41l1.42-1.42a1 1 0 1 1 1.41 1.41l-1.42 1.42a1 1 0 0 1-1.41 0Zm12.73-12.73a1 1 0 0 1 0-1.41l1.42-1.42a1 1 0 1 1 1.41 1.41l-1.42 1.42a1 1 0 0 1-1.41 0Z"/>
                    </svg>
                    <svg class="theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="currentColor" d="M21.64 13a9 9 0 1 1-10.63-10.6 1 1 0 0 1 1.21 1.32A7 7 0 0 0 20.32 12a1 1 0 0 1 1.32 1Z"/>
                    </svg>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <div class="sidebar-project-selector">
                    <project-selector id="project-selector"></project-selector>
                </div>
                <div id="diagnostics-section" class="nav-section" hidden>
                    <h3>Diagnostics</h3>
                    <ul>
                        <li><a href="#/wiki/DOCTOR" class="nav-link">Doctor Report</a></li>
                    </ul>
                </div>
                <div class="nav-section">
                    <h3>Project Wiki</h3>
                    <ul id="wiki-links">
                        <!-- Dynamic list of wiki files -->
                    </ul>
                </div>
                <div class="nav-section">
                    <h3>Changes</h3>
                    <ul id="changes-links">
                        <li><a href="#/changes" class="nav-link">All Changes</a></li>
                        <li id="archived-link" hidden><a href="#/changes/archived" class="nav-link">Archived</a></li>
                        <li><a href="#/roadmap" class="nav-link">Roadmap</a></li>
                    </ul>
                </div>
                <div class="nav-section">
                    <h3>Telemetry & Insights</h3>
                    <ul id="telemetry-links">
                        <li><a href="#/insights/cadence" class="nav-link">Task Cadence</a></li>
                        <li><a href="#/insights/coverage" class="nav-link">Coverage</a></li>
                        <li><a href="#/insights/openapi" class="nav-link">API Specification</a></li>
                    </ul>
                </div>
            </nav>
            <div
                class="sidebar-resizer"
                id="sidebar-resizer"
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize sidebar"
                tabindex="0"
            ></div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div id="content-container" class="content-container">
                <!-- Dynamically loaded content -->
            </div>
        </main>
    </div>

    <toast-notification id="toast-notification"></toast-notification>

    <!-- Load components -->
    <script src="/components/_base.js"></script>
    <script src="/components/ProjectSelector.js"></script>
    <script src="/components/InfoBox.js"></script>
    <script src="/components/MetricsCard.js"></script>
    <script src="/components/TaskCadence.js"></script>
    <script src="/components/Changes.js"></script>
    <script src="/components/ChangeFlowGraph.js"></script>
    <script src="/components/CommitHeatmap.js"></script>
    <script src="/components/CoverageReport.js"></script>
    <script src="/components/RoadmapBoard.js"></script>
    <script src="/components/ToastNotification.js"></script>
    <!-- Main App Logic -->
    <script src="/app.js"></script>
</body>
</html>
